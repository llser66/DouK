name: Offline regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: DouK-Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Windows desktop launchers
        run: python -m unittest discover -s tests -p 'test_windows_launchers.py' -v
      - name: Offline business and UI regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax
        run: |
          node --check reports.js
          node --check reporting-admin.js
      - name: Generate documentation
        run: python build_docs.py
